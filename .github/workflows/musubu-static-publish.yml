name: Musubu Static Publish

on:
  push:
    branches: [main]
    paths:
      - ".musubu-deploy/**"
      - ".github/workflows/musubu-static-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build static HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          cat .musubu-deploy/index.html.gz.b64.* | base64 -d | gzip -d > public/index.html
          cat > next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            async redirects() {
              return [
                {
                  source: "/v1-clean",
                  destination: "/",
                  permanent: true
                }
              ];
            },
            async rewrites() {
              return {
                beforeFiles: [
                  {
                    source: "/",
                    destination: "/index.html"
                  }
                ]
              };
            },
            experimental: {
              cpus: 1,
              parallelServerBuildTraces: false,
              parallelServerCompiles: false,
              webpackBuildWorker: false,
              workerThreads: true
            }
          };

          export default nextConfig;
          EOF
          sed -i 's/^          //' next.config.mjs
          required=(
            "director-watanabe-upload.jpg"
            "hero-beauty.jpg"
            "hero-community.png"
            "hero-food.webp"
            "hero-mind-tea.png"
            "hero-move.jpg"
            "hero-rice.png"
            "logo-musubu-full.png"
            "musubu-mark.png"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "public/images/$f" ]; then
              found="$(find . -path './.git' -prune -o -type f -name "$f" -print -quit)"
              if [ -n "$found" ] && [ "$found" != "./public/images/$f" ]; then
                cp "$found" "public/images/$f"
              fi
            fi
            if [ ! -f "public/images/$f" ]; then
              echo "::error::Missing public/images/$f"
              missing=1
            fi
          done
          exit "$missing"
      - name: Commit static publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html next.config.mjs public/images
          git rm -r .musubu-deploy || true
          git rm .github/workflows/musubu-static-publish.yml || true
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish Musubu static LP"
            git push
          fi
